services:
  postgres:
    image: postgres:17
    container_name: colchaderetalhos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: colchaderetalhos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d colchaderetalhos']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: colchaderetalhos_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  migrate:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: colchaderetalhos-app
    container_name: colchaderetalhos_migrate
    command: python manage.py migrate --noinput
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: colchaderetalhos-app
    container_name: colchaderetalhos_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  celery:
    image: colchaderetalhos-app
    container_name: colchaderetalhos_celery
    restart: unless-stopped
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  celery-beat:
    image: colchaderetalhos-app
    container_name: colchaderetalhos_celery_beat
    restart: unless-stopped
    command: celery -A core beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  postgres_data:
